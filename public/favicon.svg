  <!-- Main Document Base -->
  <rect x="10" y="4" width="44" height="56" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="3.5" />
  
  <!-- Folded Corner Effect or Top Header Bar -->
  <path d="M10 10C10 6.68629 12.6863 4 16 4H48C51.3137 4 54 6.68629 54 10V18H10V10Z" fill="#2563eb" />
  
  <!-- Header Title Lines/Icon inside blue header -->
